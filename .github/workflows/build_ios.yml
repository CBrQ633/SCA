name: Build iOS (Unsigned)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Force Delete Bad Configs
        run: |
          # حذف أي ملفات إعدادات قديمة تماماً
          rm -f ios/Flutter/Generated.xcconfig
          rm -f ios/Flutter/flutter_export_environment.sh
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          flutter clean

      - name: Install Dependencies
        run: flutter pub get

      - name: Pre-configure iOS
        run: |
          # توليد الإعدادات المناسبة للماك
          flutter build ios --config-only --no-codesign

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sca-ios-release
          path: Runner.ipa
