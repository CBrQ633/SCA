name: Build iOS (Unsigned)

on:
  push:
    branches: ["main", "feature/*"]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Build iOS (No Codesign)
        run: |
          # The workflow fails if Podfile isn't there, usually flutter build ios creates it
          # but we need to ensure pods are handled.
          flutter build ios --release --no-codesign

      - name: Create Payload directory
        run: mkdir Payload

      - name: Move App to Payload
        run: mv build/ios/iphoneos/Runner.app Payload/

      - name: Zip Payload
        run: zip -r Runner.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: Runner.ipa
