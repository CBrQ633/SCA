name: Build iOS (Unsigned)

on:
  push:
    branches: ["main", "feature/*"]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Clean iOS Build Folder
        run: |
          cd ios
          rm -rf Pods
          rm -rf build
          rm -f Podfile.lock
          rm -f Flutter/Generated.xcconfig
          rm -f Flutter/flutter_export_environment.sh
          cd ..

      - name: Get Pub Packages
        run: flutter pub get

      - name: Build iOS (No Codesign)
        # Note: Flutter build ios will automatically run pod install correctly
        run: flutter build ios --release --no-codesign

      - name: Create IPA (Standard Method)
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sca-ios-release
          path: Runner.ipa
