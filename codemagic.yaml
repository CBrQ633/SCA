workflows:
  android-workflow:
    name: SCA Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Get dependencies
        script: | 
          flutter pub get
      - name: Build Android APK
        script: | 
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  ios-workflow:
    name: SCA iOS Build (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Setup & Clean Environment
        script: | 
          # Remove local config leaks from Windows
          rm -f ios/Flutter/Generated.xcconfig
          rm -f ios/Flutter/flutter_export_environment.sh
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          flutter clean
      - name: Get Flutter dependencies
        script: | 
          flutter pub get
      - name: Install CocoaPods (Forced update)
        script: | 
          cd ios
          pod install --repo-update
      - name: Build iOS (No Code Signing)
        script: | 
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
